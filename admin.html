<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#100d0f">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
    <title>Ruang Admin — Hunter’s Archive</title>
    <link rel="stylesheet" href="/styles/main.css">
    <link rel="stylesheet" href="/styles/components/admin.css">
  </head>
  <body class="admin-body">
    <header class="drive-nav">
      <span class="drive-nav__brand"><span class="drive-nav__mark" aria-hidden="true">†</span><span>HUNTER’S ARCHIVE · ADMIN</span></span>
      <div class="drive-nav__right">
        <span class="drive-nav__mode" id="admin-user" hidden></span>
        <button class="button button--quiet" id="logout" type="button" hidden>Keluar</button>
      </div>
    </header>

    <main class="admin section-shell" id="main-content">
      <section class="admin-login" id="login-view" aria-labelledby="login-title" hidden>
        <p class="eyebrow"><span class="eyebrow__rule" aria-hidden="true"></span> Akses terbatas</p>
        <h1 id="login-title">Masuk<span>.</span></h1>
        <form class="admin-form" id="login-form" autocomplete="on">
          <label>Username<input name="username" type="text" autocomplete="username" required maxlength="200"></label>
          <label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="500"></label>
          <button class="button button--solid" type="submit" id="login-submit">Masuk</button>
          <p class="admin-error" id="login-error" role="alert"></p>
        </form>
      </section>

      <section class="admin-dash" id="dash-view" hidden aria-label="Pengelola arsip">
        <div class="drive-toolbar">
          <div class="drive-toolbar__location">
            <button class="button button--quiet" id="back" type="button" hidden>← Kembali</button>
            <nav class="breadcrumbs" id="crumbs" aria-label="Lokasi folder"></nav>
          </div>
          <div class="drive-toolbar__actions admin-actions">
            <button class="button button--solid" id="new-folder" type="button">+ Folder</button>
            <button class="button button--quiet" id="pick-files" type="button">Upload file</button>
            <button class="button button--quiet" id="pick-folder" type="button">Upload folder</button>
            <button class="button button--quiet" id="refresh" type="button" aria-label="Segarkan">↻</button>
          </div>
        </div>
        <input type="file" id="file-input" multiple hidden>
        <input type="file" id="folder-input" webkitdirectory multiple hidden>

        <div class="admin-bulk" id="bulk" hidden>
          <span id="bulk-count" class="font-mono"></span>
          <button class="button button--quiet" id="bulk-move" type="button">Pindahkan</button>
          <button class="button button--danger" id="bulk-delete" type="button">Hapus</button>
        </div>

        <div class="admin-drop" id="drop" tabindex="-1">
          <div class="admin-drop__hint" aria-hidden="true">Lepas file atau folder di sini untuk mengunggah</div>
          <div class="admin-row admin-row--head font-mono" aria-hidden="true">
            <label class="admin-check"><input type="checkbox" id="select-all" aria-label="Pilih semua"></label>
            <span>NAMA</span><span>JENIS / UKURAN</span><span>DIUBAH</span><span>AKSI</span>
          </div>
          <div id="list" aria-live="polite"></div>
          <button class="load-more" id="more" type="button" hidden>Muat berikutnya ↓</button>
        </div>

        <section class="admin-queue" id="queue" hidden aria-label="Antrean upload">
          <div class="admin-queue__head"><strong id="queue-title">Upload</strong><button class="file-action" id="queue-clear" type="button">Bersihkan selesai</button></div>
          <ul id="queue-list"></ul>
        </section>
        <p class="archive-status" id="status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="/scripts/admin/main.js"></script>
  </body>
</html>

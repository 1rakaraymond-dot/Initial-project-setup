<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#100d0f">
    <meta name="description" content="Arsip folder bergaya gothic Blood Moon: jelajahi dan unduh file arsip.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
    <title>Hunter’s Archive — Folder Explorer</title>
    <link rel="stylesheet" href="/styles/main.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Lewati ke isi</a>
    <header class="drive-nav">
      <a class="drive-nav__brand" href="#archive" aria-label="Archive, beranda">
        <span class="drive-nav__mark" aria-hidden="true">†</span>
        <span>HUNTER’S ARCHIVE</span>
      </a>
      <div class="drive-nav__right">
        <span class="drive-nav__mode" id="mode-indicator">MOCK MODE</span>
        <a class="button button--quiet" id="admin-link" href="/admin.html" rel="nofollow">Admin</a>
      </div>
    </header>

    <main id="main-content" class="archive-app section-shell">
      <section class="archive-head" aria-labelledby="archive-title">
        <div class="archive-head__topline">
          <p class="eyebrow"><span class="eyebrow__rule" aria-hidden="true"></span> Hunter’s records</p>
          <p class="archive-head__count font-mono" id="root-count">07 FOLDERS</p>
        </div>
        <div class="archive-head__main">
          <h1 id="archive-title">Archive<span>.</span></h1>
          <p class="archive-head__description"></p>
        </div>
      </section>

      <section class="drive-panel" id="archive" aria-label="Folder explorer">
        <div class="drive-toolbar">
          <div class="drive-toolbar__location">
            <button class="button button--quiet back-folder" id="back-folder" type="button" hidden aria-label="Kembali ke folder sebelumnya"><span aria-hidden="true">←</span> Kembali</button>
            <nav class="breadcrumbs" id="breadcrumbs" aria-label="Lokasi folder"></nav>
          </div>
          <div class="drive-toolbar__actions">
            <button class="button button--quiet" id="refresh-drive" type="button" aria-label="Segarkan daftar arsip">↻ Segarkan</button>
          </div>
        </div>

        <div class="folder-stage" id="folder-stage" aria-label="Folder utama"></div>
        <button class="load-more load-more--folders" id="load-more-folders" type="button" hidden>Muat folder berikutnya ↓</button>

        <section class="file-view" id="file-view" hidden aria-labelledby="current-folder-title">
          <div class="file-view__header">
            <div>
              <p class="file-view__eyebrow font-mono" id="current-folder-path">FOLDER</p>
              <h2 id="current-folder-title">Folder</h2>
            </div>
            <label class="file-search">
              <span class="visually-hidden">Cari file</span>
              <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m13 13 4 4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
              <input id="file-search" type="search" placeholder="Cari nama file" autocomplete="off">
            </label>
          </div>
          <div class="file-list-head font-mono" aria-hidden="true"><span>NAMA</span><span>JENIS / UKURAN</span><span>AKSI</span></div>
          <div class="file-list" id="file-list"></div>
          <button class="load-more" id="load-more" type="button" hidden>Muat file berikutnya ↓</button>
        </section>

        <p class="archive-status" id="status-message" role="status" aria-live="polite">Memuat arsip…</p>
      </section>
    </main>

    <footer class="drive-footer section-shell">
      <span>HUNTER’S ARCHIVE / READ-ONLY</span>
      <span>YHARNAM · RECORDS</span>
    </footer>

    <aside class="debug-panel" id="debug-panel" hidden aria-label="Debug panel">
      <div class="debug-panel__head"><strong>DEBUG / FOLDER ENGINE</strong><button type="button" id="debug-close" aria-label="Tutup debug panel">×</button></div>
      <label>Perspective <output id="debug-perspective-value">1200 px</output><input id="debug-perspective" type="range" min="800" max="1200" step="25" value="1200"></label>
      <label>Idle tilt <output id="debug-tilt-value">8°</output><input id="debug-tilt" type="range" min="0" max="12" step="1" value="8"></label>
      <label>Hover lift <output id="debug-hover-value">20 px</output><input id="debug-hover" type="range" min="0" max="30" step="1" value="20"></label>
      <label>Open lift <output id="debug-open-value">60 px</output><input id="debug-open" type="range" min="20" max="80" step="5" value="60"></label>
      <label class="debug-panel__toggle"><input id="debug-live" type="checkbox"> Gunakan server API (nonaktif = mock)</label>
      <button class="button button--solid" id="debug-test-fetch" type="button">Test fetch daftar</button>
      <pre id="debug-output" aria-live="polite">Debug output akan muncul di sini.</pre>
    </aside>
    <script type="module" src="/scripts/main.js"></script>
  </body>
</html>
